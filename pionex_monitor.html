<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Pares - Pionex API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #f59e0b;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background-color: #f59e0b;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #d97706;
        }

        .stats {
            margin-bottom: 15px;
            font-size: 14px;
            color: #94a3b8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #334155;
            color: #f59e0b;
            font-size: 14px;
            text-transform: uppercase;
        }

        tr {
            border-bottom: 1px solid #334155;
        }

        tr:hover {
            background-color: #182232;
        }

        .price {
            font-family: monospace;
            font-weight: bold;
            color: #38bdf8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            color: #f59e0b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pionex Market Monitor</h1>
    
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Filtrar por par (ex: BTC, ETH, USDT)..." onkeyup="filtrarPares()">
        <button onclick="carregarDados()">Atualizar Dados</button>
    </div>

    <div class="stats" id="statsText">Carregando dados da Pionex...</div>

    <table>
        <thead>
            <tr>
                <th>Símbolo</th>
                <th>Moeda Base</th>
                <th>Cotação</th>
                <th>Preço Atual</th>
                <th>Mínimo por Ordem</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="5" class="loading">Buscando pares na API da Pionex...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const API_BASE = "https://api.pionex.com";
    let listaPares = [];
    let mapaPrecos = {};

    async function carregarDados() {
        const tbody = document.getElementById("tableBody");
        const stats = document.getElementById("statsText");
        tbody.innerHTML = `<tr><td colspan="5" class="loading">Carregando da API Pionex...</td></tr>`;

        try {
            // 1. Busca todos os pares/símbolos SPOT da Pionex
            const resSymbols = await fetch(`${API_BASE}/api/v1/common/symbols?type=SPOT`);
            const dataSymbols = await resSymbols.json();

            // 2. Busca todas as cotações/tickers recentes
            const resTickers = await fetch(`${API_BASE}/api/v1/market/tickers`);
            const dataTickers = await resTickers.json();

            if (dataSymbols.result && dataTickers.result) {
                listaPares = dataSymbols.data.symbols;

                // Mapeia preços para busca rápida por símbolo
                mapaPrecos = {};
                dataTickers.data.tickers.forEach(t => {
                    mapaPrecos[t.symbol] = t.close;
                });

                stats.innerText = `Total de pares cadastrados na Pionex: ${listaPares.length}`;
                renderizarTabela(listaPares);
            } else {
                tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">Erro ao consultar API da Pionex.</td></tr>`;
            }
        } catch (error) {
            console.error("Erro na requisição:", error);
            tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">Erro de conexão com a API da Pionex.</td></tr>`;
        }
    }

    function renderizarTabela(pares) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        // Exibe apenas os primeiros 50 itens para melhor performance
        const limitePares = pares.slice(0, 50);

        limitePares.forEach(par => {
            const preco = mapaPrecos[par.symbol] ? parseFloat(mapaPrecos[par.symbol]) : "N/A";
            const minAmount = par.minAmount || "N/A";

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${par.symbol}</strong></td>
                <td>${par.baseCurrency}</td>
                <td>${par.quoteCurrency}</td>
                <td class="price">${preco}</td>
                <td>${minAmount} ${par.baseCurrency}</td>
            `;
            tbody.appendChild(tr);
        });

        if (pares.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Nenhum par encontrado.</td></tr>`;
        }
    }

    function filtrarPares() {
        const query = document.getElementById("searchInput").value.toUpperCase();
        const filtrados = listaPares.filter(p => 
            p.symbol.toUpperCase().includes(query) ||
            p.baseCurrency.toUpperCase().includes(query) ||
            p.quoteCurrency.toUpperCase().includes(query)
        );
        renderizarTabela(filtrados);
    }

    window.onload = carregarDados;
</script>

</body>
</html>
