<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testador DCA Futuros & Stocks - Pionex</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1, h2 { color: #f59e0b; text-align: center; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #f59e0b; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #d97706; }
        .status-liquidado { color: #ef4444; font-weight: bold; }
        .status-ok { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Testador DCA Futuros & Stocks (Pionex)</h1>

    <div class="card">
        <label>Selecione o Par (Futuros / Stocks):</label>
        <select id="selectPar" onchange="carregarParSelecionado()">
            <option value="">Carregando pares da Pionex...</option>
        </select>
    </div>

    <div class="card">
        <h2>Configuração DCA & Risco</h2>
        <div class="grid">
            <div>
                <label>Queda Adição (%)</label>
                <input type="number" id="quedaAdicao" value="3.2" step="0.1">
            </div>
            <div>
                <label>Take Profit (%)</label>
                <input type="number" id="takeProfit" value="3.0" step="0.1">
            </div>
            <div>
                <label>Ordens de Segurança (Max)</label>
                <input type="number" id="maxOrdens" value="12">
            </div>
            <div>
                <label>Alavancagem (1x - 100x)</label>
                <input type="number" id="alavancagem" value="1" min="1" max="100">
            </div>
            <div>
                <label>Mult. Volume (Martingale)</label>
                <input type="number" id="multVol" value="1.1" step="0.1">
            </div>
            <div>
                <label>Mult. Passo de Queda</label>
                <input type="number" id="multPasso" value="1.0" step="0.1">
            </div>
            <div>
                <label>Investimento Base Inicial (USDT)</label>
                <input type="number" id="investimentoInicial" value="100">
            </div>
        </div>
        <button onclick="executarSimulacao()">▶ Executar Teste Manual em Futuros</button>
    </div>

    <div class="card" id="painelResultado">
        <h2>Resultado da Simulação</h2>
        <p>Cobertura Teórica de Queda: <span id="resCobertura">0%</span></p>
        <p>Status da Carteira: <span id="resStatus">Aguardando Teste</span></p>
    </div>
</div>

<script>
    const API_BASE = "https://api.pionex.com";

    async function carregarParesFuturos() {
        const select = document.getElementById("selectPar");
        try {
            // Busca símbolos PERP (Futuros e Stocks Perpétuas)
            const res = await fetch(`${API_BASE}/api/v1/common/symbols?type=PERP`);
            const data = await res.json();

            if (data.result) {
                select.innerHTML = "";
                data.data.symbols.forEach(s => {
                    const option = document.createElement("option");
                    option.value = s.symbol;
                    option.text = s.symbol;
                    select.appendChild(option);
                });
            } else {
                select.innerHTML = "<option>Erro ao carregar pares</option>";
            }
        } catch (e) {
            select.innerHTML = "<option>Erro de Conexão com API</option>";
        }
    }

    function executarSimulacao() {
        const quedaInicial = parseFloat(document.getElementById("quedaAdicao").value);
        const maxOrdens = parseInt(document.getElementById("maxOrdens").value);
        const multPasso = parseFloat(document.getElementById("multPasso").value);
        const alavancagem = parseFloat(document.getElementById("alavancagem").value);

        // Cálculo da Cobertura Teórica de Queda Total
        let coberturaTotal = 0;
        let passoAtual = quedaInicial;

        for (let i = 0; i < maxOrdens; i++) {
            coberturaTotal += passoAtual;
            passoAtual *= multPasso;
        }

        // Em futuros, o limite de margem depende da alavancagem
        const limiteLiquidação = 100 / alavancagem;

        document.getElementById("resCobertura").innerText = coberturaTotal.toFixed(2) + "%";

        const elemStatus = document.getElementById("resStatus");
        if (coberturaTotal >= limiteLiquidação && alavancagem > 1) {
            elemStatus.className = "status-liquidado";
            elemStatus.innerText = `Risco Alto de LIQUIDAÇÃO! (Margem máx com ${alavancagem}x é ${limiteLiquidação.toFixed(1)}%)`;
        } else {
            elemStatus.className = "status-ok";
            elemStatus.innerText = "Configuração Segura dentro da margem estipulada.";
        }
    }

    window.onload = carregarParesFuturos;
</script>

</body>
</html>
