<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pionex DCA Futures Optimizer & Risk Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121318; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; display: flex; justify-content: center; }
    .card { background: #1c1e24; border-radius: 16px; padding: 16px; width: 100%; max-width: 480px; }
    .header { margin-bottom: 12px; }
    .pair-search-container { display: flex; gap: 6px; margin-bottom: 6px; }
    .search-input { background: #2b2f3a; border: 1px solid #3b4050; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 13px; width: 45%; }
    .title-select { background: #2b2f3a; color: #fff; border: 1px solid #3b4050; font-size: 13px; font-weight: bold; padding: 6px; border-radius: 6px; width: 55%; }
    .price-display { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .price { font-size: 16px; font-weight: bold; color: #0ecb81; }
    .tabs { display: flex; background: #2b2f3a; border-radius: 8px; padding: 2px; margin-bottom: 12px; }
    .tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 12px; color: #848e9c; }
    .tab.active { background: #0ecb81; color: #fff; }
    .section-title { font-size: 11px; font-weight: bold; color: #0ecb81; margin: 10px 0 6px 0; border-bottom: 1px solid #2b2f3a; padding-bottom: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field { margin-bottom: 8px; }
    label { font-size: 10px; color: #848e9c; display: block; margin-bottom: 2px; }
    input, select { width: 100%; padding: 8px; background: #2b2f3a; border: none; color: #fff; border-radius: 6px; font-size: 13px; }
    button { width: 100%; padding: 12px; background: #0ecb81; border: none; color: white; font-weight: bold; font-size: 13px; border-radius: 8px; cursor: pointer; margin-top: 8px; }
    .btn-opt { background: #f3ba2f; color: #121318; font-weight: bold; margin-top: 4px; }
    .stats { margin-top: 12px; background: #181a20; padding: 10px; border-radius: 8px; font-size: 11px; line-height: 1.6; }
    .row { display: flex; justify-content: space-between; }
    .val { font-weight: bold; color: #fff; }
    .danger { color: #f6465d !important; }
    .highlight { color: #f3ba2f !important; }
    .opt-results { background: #181a20; border: 1px solid #3b4050; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 11px; display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="pair-search-container">
      <input type="text" id="pairSearch" class="search-input" placeholder="Buscar par..." oninput="filterPairs()">
      <select id="pairSelect" class="title-select" onchange="changePair()">
        <option value="SOLUSDT">SOL/USDT Perp</option>
      </select>
    </div>
    <div class="price-display">
      <span style="font-size: 12px; color: #848e9c;">Cotação Atual:</span>
      <div class="price" id="pionexPrice">Conectando...</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabLongo" onclick="setDirection('Longo')">Longo (Long)</div>
    <div class="tab" id="tabShort" onclick="setDirection('Encurtar')">Encurtar (Short)</div>
  </div>

  <div class="section-title" style="color: #f3ba2f;">OTIMIZADOR AUTOMÁTICO DE PARÂMETROS</div>
  <div class="grid">
    <div class="field">
      <label>Histórico Otimização (Dias)</label>
      <input type="number" id="optDays" value="60" min="7" max="365">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button onclick="runOptimization()" class="btn-opt">Encontrar Melhor Configuração</button>
    </div>
  </div>

  <div id="optResults" class="opt-results">
    <div style="font-weight: bold; color: #f3ba2f; margin-bottom: 4px;">MELHOR CONFIGURAÇÃO ENCONTRADA:</div>
    <div id="optDetails">Rodando análise...</div>
    <button onclick="applyOptimizedSettings()" style="background: #2b2f3a; border: 1px solid #f3ba2f; color: #f3ba2f; padding: 6px; font-size: 11px; margin-top: 6px;">Aplicar Parâmetros ao Bot</button>
  </div>

  <div class="section-title">CONFIGURAÇÃO DE ORDENS</div>
  <div class="grid">
    <div class="field">
      <label>Queda Adição (%)</label>
      <input type="number" id="addPricePct" value="3.2" step="0.1" oninput="calculateGridCoverage()">
    </div>
    <div class="field">
      <label>Take Profit (%)</label>
      <input type="number" id="tpPct" value="1.5" step="0.1">
    </div>
  </div>

  <div class="grid">
    <div class="field">
      <label>Ordens Segurança (Max)</label>
      <input type="number" id="maxSafetyOrders" value="10" oninput="calculateGridCoverage()">
    </div>
    <div class="field">
      <label>Alavancagem (1x - 100x)</label>
      <input type="number" id="leverage" value="5" min="1" max="100" oninput="calculateGridCoverage()">
    </div>
  </div>

  <div class="section-title">MULTIPLICADORES DCA</div>
  <div class="grid">
    <div class="field">
      <label>Mult. Volume (Martingale)</label>
      <input type="number" id="volMult" value="1.2" step="0.1" oninput="calculateGridCoverage()">
    </div>
    <div class="field">
      <label>Mult. Passo de Queda</label>
      <input type="number" id="stepMult" value="1.0" step="0.1" oninput="calculateGridCoverage()">
    </div>
  </div>

  <div class="field">
    <label>Investimento Base Inicial (USDT)</label>
    <input type="number" id="baseInvestment" value="20" oninput="calculateGridCoverage()">
  </div>

  <div class="stats">
    <div class="row"><span>Cobertura Total de Queda (Y%):</span><span class="val highlight" id="gridDropCoverage">0.00%</span></div>
    <div class="row"><span>Preço Médio Final Projetado:</span><span class="val" id="projectedAvgPrice">--</span></div>
    <div class="row"><span>Liquidação Final Após DCA:</span><span class="val danger" id="finalLiqPrice">--</span></div>
  </div>
</div>

<script>
  let currentPrice = 0;
  let allUsdtPairs = [];
  let currentPair = "SOLUSDT";
  let direction = 'Longo';
  let socket = null;
  let bestPreset = null;

  async function loadPairs() {
    try {
      let res = await fetch("https://api.binance.com/api/v3/ticker/price");
      let data = await res.json();
      allUsdtPairs = data.filter(p => p.symbol.endsWith("USDT")).map(p => p.symbol).sort();
      renderPairOptions(allUsdtPairs);
      initWebSocket();
    } catch(e) {
      initWebSocket();
    }
  }

  function renderPairOptions(pairs) {
    let select = document.getElementById('pairSelect');
    select.innerHTML = "";
    pairs.forEach(pair => {
      let opt = document.createElement('option');
      opt.value = pair;
      opt.innerText = pair.replace("USDT", "/USDT Perp");
      if(pair === currentPair) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function filterPairs() {
    let query = document.getElementById('pairSearch').value.toUpperCase();
    let filtered = allUsdtPairs.filter(p => p.includes(query));
    renderPairOptions(filtered);
    if (filtered.length > 0) {
      currentPair = filtered[0];
      changePair();
    }
  }

  function initWebSocket() {
    if (socket) socket.close();
    socket = new WebSocket(`wss://stream.binance.com:9443/ws/${currentPair.toLowerCase()}@trade`);
    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      currentPrice = parseFloat(data.p);
      document.getElementById('pionexPrice').innerText = currentPrice.toFixed(3) + " USDT";
      calculateGridCoverage();
    };
  }

  function changePair() {
    currentPair = document.getElementById('pairSelect').value;
    document.getElementById('optResults').style.display = 'none';
    initWebSocket();
  }

  function setDirection(dir) {
    direction = dir;
    document.getElementById('tabLongo').classList.toggle('active', dir === 'Longo');
    document.getElementById('tabShort').classList.toggle('active', dir === 'Encurtar');
    calculateGridCoverage();
  }

  function calculateGridCoverage() {
    if (currentPrice === 0) return;
    const baseInv = parseFloat(document.getElementById('baseInvestment').value);
    const addPct = parseFloat(document.getElementById('addPricePct').value) / 100;
    const maxSo = parseInt(document.getElementById('maxSafetyOrders').value);
    const lev = parseFloat(document.getElementById('leverage').value);
    const volMult = parseFloat(document.getElementById('volMult').value);
    const stepMult = parseFloat(document.getElementById('stepMult').value);

    let price = currentPrice;
    let currentStep = addPct;
    let currentVol = baseInv * lev;
    let totalQty = currentVol / price;
    let totalNotional = currentVol;

    for (let i = 1; i <= maxSo; i++) {
      price = direction === 'Longo' ? price * (1 - currentStep) : price * (1 + currentStep);
      currentVol *= volMult;
      let qty = currentVol / price;
      totalQty += qty;
      totalNotional += currentVol;
      currentStep *= stepMult;
    }

    let projAvgPrice = totalNotional / totalQty;
    let dropCoverage = Math.abs((price - currentPrice) / currentPrice) * 100;
    let maintenanceMargin = 0.005;
    let finalLiq = direction === 'Longo' 
      ? projAvgPrice * (1 - (1 / lev) + maintenanceMargin)
      : projAvgPrice * (1 + (1 / lev) - maintenanceMargin);

    document.getElementById('gridDropCoverage').innerText = dropCoverage.toFixed(2) + "%";
    document.getElementById('projectedAvgPrice').innerText = projAvgPrice.toFixed(3);
    document.getElementById('finalLiqPrice').innerText = finalLiq > 0 ? finalLiq.toFixed(3) : "Seguro";
  }

  // MOTOR DE OTIMIZAÇÃO DE PARÂMETROS
  async function runOptimization() {
    const days = parseInt(document.getElementById('optDays').value);
    document.getElementById('optResults').style.display = 'block';
    document.getElementById('optDetails').innerHTML = "<i>Analisando variações históricas... Aguarde.</i>";

    try {
      let interval = days <= 30 ? "1h" : "4h";
      let res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${currentPair}&interval=${interval}&limit=1000`);
      let candles = await res.json();

      let bestProfit = -999999;
      let bestConfig = null;

      // Amplitude de Busca (Grade de Parâmetros Testados)
      const testLeverages = [3, 5, 10];
      const testAddPcts = [0.015, 0.025, 0.035, 0.05]; // 1.5%, 2.5%, 3.5%, 5%
      const testTps = [0.01, 0.02, 0.03]; // 1%, 2%, 3%
      const testMaxSos = [6, 10, 12];
      const testVolMults = [1.1, 1.3];

      for (let lev of testLeverages) {
        for (let addPct of testAddPcts) {
          for (let tpPct of testTps) {
            for (let maxSo of testMaxSos) {
              for (let volMult of testVolMults) {

                let initialInvestment = 20;
                let balance = initialInvestment;
                let isLiquidated = false;
                let cycles = 0;
                let btState = { inPosition: false, avgPrice: 0, totalQty: 0, soFilled: 0, nextAddPrice: 0, tpPrice: 0, lastVol: 0, lastStepPct: 0 };

                for (let c of candles) {
                  let lowPrice = parseFloat(c[3]);
                  let highPrice = parseFloat(c[2]);
                  let closePrice = parseFloat(c[4]);

                  if (!btState.inPosition) {
                    btState.inPosition = true;
                    btState.avgPrice = closePrice;
                    btState.lastVol = initialInvestment * lev;
                    btState.totalQty = btState.lastVol / closePrice;
                    btState.soFilled = 0;
                    btState.lastStepPct = addPct;
                    btState.nextAddPrice = direction === 'Longo' ? closePrice * (1 - addPct) : closePrice * (1 + addPct);
                    btState.tpPrice = direction === 'Longo' ? closePrice * (1 + (tpPct / lev)) : closePrice * (1 - (tpPct / lev));
                    continue;
                  }

                  // Checagem Liquidação Dinâmica
                  let notional = btState.totalQty * btState.avgPrice;
                  let liq = direction === 'Longo' 
                    ? btState.avgPrice - ((balance - (notional * 0.005)) / (notional / btState.avgPrice))
                    : btState.avgPrice + ((balance - (notional * 0.005)) / (notional / btState.avgPrice));

                  if ((direction === 'Longo' && lowPrice <= liq) || (direction === 'Encurtar' && highPrice >= liq)) {
                    isLiquidated = true; break;
                  }

                  // Take Profit
                  let hitTP = direction === 'Longo' ? highPrice >= btState.tpPrice : lowPrice <= btState.tpPrice;
                  if (hitTP) {
                    let profit = Math.abs(btState.tpPrice - btState.avgPrice) * btState.totalQty;
                    balance += profit;
                    cycles++;
                    btState.inPosition = false;
                    continue;
                  }

                  // Ordem de Segurança
                  let hitSO = direction === 'Longo' ? lowPrice <= btState.nextAddPrice : highPrice >= btState.nextAddPrice;
                  if (hitSO && btState.soFilled < maxSo) {
                    btState.soFilled++;
                    btState.lastVol *= volMult;
                    let newQty = btState.lastVol / closePrice;
                    let totalCost = (btState.avgPrice * btState.totalQty) + (closePrice * newQty);
                    btState.totalQty += newQty;
                    btState.avgPrice = totalCost / btState.totalQty;
                    btState.nextAddPrice = direction === 'Longo' ? closePrice * (1 - (addPct * (btState.soFilled + 1))) : closePrice * (1 + (addPct * (btState.soFilled + 1)));
                    btState.tpPrice = direction === 'Longo' ? btState.avgPrice * (1 + (tpPct / lev)) : btState.avgPrice * (1 - (tpPct / lev));
                  }
                }

                if (!isLiquidated && balance > bestProfit) {
                  bestProfit = balance;
                  bestConfig = { lev, addPct: addPct * 100, tpPct: tpPct * 100, maxSo, volMult, netProfit: balance - initialInvestment, cycles };
                }

              }
            }
          }
        }
      }

      if (bestConfig) {
        bestPreset = bestConfig;
        let returnPct = ((bestConfig.netProfit / 20) * 100).toFixed(1);
        document.getElementById('optDetails').innerHTML = `
          • <b>Alavancagem:</b> ${bestConfig.lev}x<br>
          • <b>Queda Adição:</b> ${bestConfig.addPct.toFixed(2)}%<br>
          • <b>Take Profit:</b> ${bestConfig.tpPct.toFixed(2)}%<br>
          • <b>Ordens Segurança:</b> ${bestConfig.maxSo}<br>
          • <b>Mult. Volume:</b> ${bestConfig.volMult}x<br>
          • <b>Retorno Esperado (${days}d):</b> <span style="color:#0ecb81; font-weight:bold;">+${returnPct}% (+$${bestConfig.netProfit.toFixed(2)})</span><br>
          • <b>Operações Fechadas:</b> ${bestConfig.cycles} ciclos sem liquidação
        `;
      } else {
        document.getElementById('optDetails').innerText = "Nenhuma combinação 100% segura foi encontrada para a volatilidade deste par no período.";
      }

    } catch (e) {
      document.getElementById('optDetails').innerText = "Erro ao rodar otimização.";
    }
  }

  function applyOptimizedSettings() {
    if (!bestPreset) return;
    document.getElementById('leverage').value = bestPreset.lev;
    document.getElementById('addPricePct').value = bestPreset.addPct.toFixed(2);
    document.getElementById('tpPct').value = bestPreset.tpPct.toFixed(2);
    document.getElementById('maxSafetyOrders').value = bestPreset.maxSo;
    document.getElementById('volMult').value = bestPreset.volMult;
    calculateGridCoverage();
    alert("Parâmetros otimizados aplicados com sucesso aos campos de configuração!");
  }

  loadPairs();
</script>
</body>
</html>
